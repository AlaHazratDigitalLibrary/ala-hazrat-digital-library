name: Build Islamic Library

on:
  push:
    paths:
      - "books/**"
      - "build_index.py"
      - ".github/workflows/build-library.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF library
        run: pip install pypdf

      - name: Build PDF index
        run: python build_index.py

      - name: Save library database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/library.db
          git diff --cached --quiet || git commit -m "Update Islamic library"
          git push
